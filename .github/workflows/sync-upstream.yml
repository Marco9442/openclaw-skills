name: Sync OpenClaw skills

on:
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-openclaw-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out mirror
        uses: actions/checkout@v7.0.1

      - name: Synchronize OpenClaw skills
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_upstream.py

      - name: Commit and push changes
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "OpenClaw skills are already current." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          revision="$(python3 -c 'import json; print(json.load(open(".openclaw/upstream.json"))["skillsCommit"][:12])')"
          version="$(python3 -c 'import json; print(json.load(open(".openclaw/upstream.json"))["openclawVersion"])')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore(sync): update OpenClaw skills to ${revision}"
          git push
          echo "Updated mirror to OpenClaw ${version}, skills revision ${revision}." >> "$GITHUB_STEP_SUMMARY"
